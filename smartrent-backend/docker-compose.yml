version: "3.9"

services:
  api:
    build: .
    container_name: smartrent_api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    container_name: smartrent_postgres
    environment:
      POSTGRES_DB: smartrent
      POSTGRES_USER: smartrent
      POSTGRES_PASSWORD: smartrent123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartrent_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    container_name: smartrent_celery
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.worker worker --loglevel=info

volumes:
  postgres_data:
