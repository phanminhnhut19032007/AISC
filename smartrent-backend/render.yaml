services:
  - type: web
    name: renteasy-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./smartrent_demo.db
      - key: DATABASE_URL_SYNC
        value: sqlite:///./smartrent_demo.db
      - key: PYTHONIOENCODING
        value: utf-8
      - key: CORS_ORIGINS
        value: '["*"]'
